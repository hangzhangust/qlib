# Example: Run Qlib backtest with data collected from xtdata
#
# Step 1: Collect data first:
#   python -c "
#   from qlib.contrib.broker.miniQMT.data.data_collector import XtDataCollector
#   collector = XtDataCollector(target_dir='~/.qlib/qlib_data/xt_cn_data')
#   collector.collect(start_date='20200101', end_date='20231231')
#   "
#
# Step 2: Run backtest with this config:
#   qrun examples/benchmarks/LightGBM/workflow_config_lightgbm_Alpha158.yaml
#   (with provider_uri changed to ~/.qlib/qlib_data/xt_cn_data)

qlib_init:
    provider_uri: "~/.qlib/qlib_data/xt_cn_data"
    region: cn

market: &market csi300
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
    start_time: "2020-01-01"
    end_time: "2023-12-31"
    fit_start_time: "2020-01-01"
    fit_end_time: "2022-12-31"
    instruments: *market

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy.signal_strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: "2023-01-01"
        end_time: "2023-12-31"
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            freq: day
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
